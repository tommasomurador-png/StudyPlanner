name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StudyPlanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release-output/StudyPlanner.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.1' }}
          name: "Study Planner Release (${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.1' }})"
          body: |
            ## 📱 Study Planner (Release Ufficiale)

            Aggiornamento dell'applicazione con Pomodoro Timer minimalista, badge unificati e supporto Android nativo.

            ### ✨ Novità di questa release:
            - **🍅 Pomodoro Timer Minimalista:** Modalità *Lavoro* e *Pausa* affiancate con selezione rapida dei tempi, design ultra-pulito senza distrazioni e ciclo automatico studio/pausa.
            - **🎨 Badge GitHub Uniformi:** Tutti i 4 badge della repository condividono lo stesso stile grafico moderno (`for-the-badge`).
            - **📅 Calendario Planning Ottimizzato:** Griglia elegante senza sovrapposizioni e legenda separata.
            - **⚡ Animazioni Fluide Senza Rimbalzo:** Eliminato ogni saltino dalle card e dai menu a scomparsa.
            - **🌐 Cache Web Automatica:** PWA aggiornata con strategia Network-First.

            ---
            ### 📥 Download APK Diretto:
            Scarica il file **`StudyPlanner.apk`** allegato qui sotto per installarlo direttamente sul tuo smartphone Android!
          draft: false
          prerelease: false
          files: release-output/StudyPlanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
