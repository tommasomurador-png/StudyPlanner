name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StudyPlanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release-output/StudyPlanner.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.0"
          name: "Study Planner v2.0 - Android & Web Release"
          body: |
            ## 📱 Study Planner v2.0 (Release Ufficiale)

            Aggiornamento dell'applicazione con supporto Android nativo e Web PWA.

            ### ✨ Novità Principali:
            - **🎯 Focus Mode & Pomodoro:** Nuovo timer di concentrazione ispirato a Curbox con ghiera circolare fluida, preset da 15, 25, 45 e 60 minuti, selettore materie e citazioni motivazionali.
            - **📅 Calendario Planning rinnovato:** Griglia mensile moderna, numeri delle giornate centrati, gestione intelligente dei pallini task senza sovrapposizioni e barra legenda inferiore dedicata.
            - **✨ Animazioni fluide senza rimbalzo:** Eliminato il saltino ("bounce/overshoot") dall'apertura dei pannelli e dal tocco delle card.
            - **🌐 Cache Web & Service Worker:** Aggiornamento istantaneo del sito online con strategia Network-First e rimozione automatica delle vecchie versioni dalla memoria del browser.

            ---
            ### 📥 Download APK Diretto:
            Scarica il file **`StudyPlanner.apk`** allegato qui sotto per installarlo direttamente sul tuo smartphone Android!
          draft: false
          prerelease: false
          files: release-output/StudyPlanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
