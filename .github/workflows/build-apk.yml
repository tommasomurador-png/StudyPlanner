name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StudyPlanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release-output/StudyPlanner.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.1' }}
          name: "Study Planner Release ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.1' }}"
          draft: false
          prerelease: false
          files: release-output/StudyPlanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
