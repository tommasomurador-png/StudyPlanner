name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StudyPlanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release-output/StudyPlanner.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/StudyPlanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
