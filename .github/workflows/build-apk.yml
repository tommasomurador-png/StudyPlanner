name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StudyPlanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release-output/StudyPlanner.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.3' }}
          name: "Study Planner Release (${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.3' }})"
          body: |
            ## 📱 Study Planner (Release v2.0.3)

            Nuovo grande aggiornamento con 4 nuove funzionalità integrate sia per il Web sia per l'APK Android:

            ### ✨ Novità di questa release:
            - **📊 Grafico a Torta / Donut del Tempo di Studio per Materia:** Monitoraggio visivo della ripartizione del carico di studio con legenda dinamica, percentuali e conteggio task per materia.
            - **🧠 Flashcard con Ripetizione Spaziata (Metodo Leitner):** Memorizzazione a lungo termine con card 3D a ribaltamento, filtri per materia, tracciamento progressi e intervalli intelligenti (1 giorno, 3 giorni, 7 giorni).
            - **✨ Generatore Automatico di Quiz con AI & Tutor:** Incolla i tuoi appunti per generare istantaneamente quiz a risposta multipla con feedback immediato, spiegazione e conversione immediata degli errori in flashcard. Funziona sia con chiave Google Gemini sia con motore offline intelligente.
            - **📱 Widget Nativo per Schermata Home Android:** Widget nativo con visualizzazione in tempo reale della serie di giorni (streak di fuoco), promemoria task odierne e avvio rapido del Pomodoro.
            - **🍅 Pomodoro Timer Minimalista & Calendario Elegante:** Flusso continuo studio/pausa senza distrazioni e animazioni fluide senza rimbalzo.

            ---
            ### 📥 Download APK Diretto:
            Scarica il file **`StudyPlanner.apk`** allegato qui sotto per installarlo direttamente sul tuo smartphone Android!
          draft: false
          prerelease: false
          files: release-output/StudyPlanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
